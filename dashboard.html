<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotspotHub Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Russo+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b17;
      --bg-card: rgba(12, 18, 38, 0.88);
      --border-glow: rgba(112, 157, 255, 0.35);
      --cyan: #8fefff;
      --blue: #66b8ff;
      --violet: #8d7dff;
      --pink: #ee9dff;
      --lavender: #e6d8ff;
      --text-main: #eaf6ff;
      --text-soft: #bfd8ff;
      --shadow: 0 0 18px rgba(89, 147, 255, 0.18), 0 0 40px rgba(186, 101, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Russo One', sans-serif;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(84, 114, 255, 0.18), transparent 25%),
        radial-gradient(circle at bottom, rgba(196, 88, 255, 0.16), transparent 25%),
        linear-gradient(180deg, #03050d 0%, #060a16 45%, #090f1d 100%);
      color: var(--text-main);
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    button {
      padding: 12px 18px;
      border: 1px solid rgba(144, 173, 255, 0.28);
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Russo One', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, #58dfff 0%, #4e8cff 42%, #8f65ff 72%, #d57cff 100%);
      box-shadow: 0 0 14px rgba(108, 152, 255, 0.22);
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    #map {
      width: 100%;
      height: 72vh;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(136, 167, 255, 0.22);
    }

    .section-title {
      margin: 0 0 14px 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
    }

    .results-box {
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(5, 9, 20, 0.94);
      color: var(--lavender);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(131, 150, 255, 0.18);
      box-shadow: inset 0 0 12px rgba(84, 143, 255, 0.08);
      line-height: 1.9;
      font-size: 0.88rem;
    }

    .results-box::-webkit-scrollbar {
      width: 10px;
    }

    .results-box::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
    }

    .results-box::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #66b8ff, #8d7dff, #ee9dff);
      border-radius: 10px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }

      #map {
        height: 60vh;
      }

      .results-box {
        max-height: 240px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Admin Map</h1>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div id="map"></div>
    </div>

    <div class="card">
      <h3 class="section-title">Optimal Drone Position</h3>
      <div id="resultsBox" class="results-box">Waiting for user data...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    if (sessionStorage.getItem("admin_ok") !== "true") {
      window.location.href = "admin.html";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAqRdluD5I2CYDSZFtlLbPhkjjzS8V4zIA",
      authDomain: "location-3698d.firebaseapp.com",
      databaseURL: "https://location-3698d-default-rtdb.firebaseio.com",
      projectId: "location-3698d",
      storageBucket: "location-3698d.firebasestorage.app",
      messagingSenderId: "249053894413",
      appId: "1:249053894413:web:22743ce0f952f170db8244",
      measurementId: "G-M97J8EGLKW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const map = L.map("map").setView([24.7136, 46.6753], 12);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }).addTo(map);

    const markers = {};
    const circles = {};
    const resultsBox = document.getElementById("resultsBox");
    const locationsRef = ref(db, "locations");

    function toRadians(deg) {
      return deg * (Math.PI / 180);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function updateOptimalBox(users) {
      if (!users.length) {
        resultsBox.textContent = "No users found.";
        return;
      }

      let bestIndex = -1;
      let bestScore = -1;

      for (let i = 0; i < users.length; i++) {
        let closeCount = 0;

        for (let j = 0; j < users.length; j++) {
          if (i === j) continue;

          const dist = calculateDistance(
            users[i].lat, users[i].lon,
            users[j].lat, users[j].lon
          );

          if (dist < 500) {
            closeCount++;
          }
        }

        if (closeCount > bestScore) {
          bestScore = closeCount;
          bestIndex = i;
        }
      }

      if (bestIndex === -1) {
        resultsBox.textContent = "No optimal user found.";
        return;
      }

      const bestUser = users[bestIndex];

      let output = "";
      output += "OPTIMAL DRONE POSITION\n";
      output += `Name: ${bestUser.name}\n`;
      output += `Latitude: ${bestUser.lat.toFixed(6)}\n`;
      output += `Longitude: ${bestUser.lon.toFixed(6)}\n`;
      output += `Nearby users within 500m: ${bestScore}\n\n`;
      output += "DISTANCES TO OTHERS\n";

      for (let i = 0; i < users.length; i++) {
        if (i === bestIndex) continue;

        const dist = calculateDistance(
          bestUser.lat, bestUser.lon,
          users[i].lat, users[i].lon
        );

        output += `To ${users[i].name} : ${dist.toFixed(2)} meters\n`;
      }

      resultsBox.textContent = output;
    }

    onValue(locationsRef, (snapshot) => {
      const data = snapshot.val() || {};

      for (const key in markers) {
        if (!data[key]) {
          map.removeLayer(markers[key]);
          delete markers[key];
        }
      }

      for (const key in circles) {
        if (!data[key]) {
          map.removeLayer(circles[key]);
          delete circles[key];
        }
      }

      const bounds = [];
      const users = [];

      for (const key in data) {
        const user = data[key];
        if (typeof user.lat !== "number" || typeof user.lon !== "number") continue;

        const label = user.name && user.name.trim() ? user.name : "Unknown";
        const accuracy = typeof user.accuracy === "number" ? user.accuracy : 0;

        users.push({
          id: key,
          name: label,
          lat: user.lat,
          lon: user.lon
        });

        const popupText = `
          <div style="font-family: 'Russo One', sans-serif; min-width: 140px;">
            <b>${label}</b><br>
            Lat: ${user.lat}<br>
            Lon: ${user.lon}<br>
            Accuracy: ${Math.round(accuracy)} m
          </div>
        `;

        if (!markers[key]) {
          markers[key] = L.marker([user.lat, user.lon]).addTo(map);
        } else {
          markers[key].setLatLng([user.lat, user.lon]);
        }

        if (!circles[key]) {
          circles[key] = L.circle([user.lat, user.lon], {
            radius: accuracy,
            color: "#9bbcff",
            fillColor: "#b568ff",
            fillOpacity: 0.2
          }).addTo(map);
        } else {
          circles[key].setLatLng([user.lat, user.lon]);
          circles[key].setRadius(accuracy);
        }

        markers[key].bindPopup(popupText);
        bounds.push([user.lat, user.lon]);
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }

      updateOptimalBox(users);
    });

    window.logout = function logout() {
      sessionStorage.removeItem("admin_ok");
      window.location.href = "admin.html";
    };
  </script>
</body>
</html>
