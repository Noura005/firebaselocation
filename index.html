<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotspotHub</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b17;
      --bg-card: rgba(12, 18, 38, 0.88);
      --border-glow: rgba(112, 157, 255, 0.35);
      --cyan: #8fefff;
      --bright-cyan: #63e9ff;
      --ice: #d8f9ff;
      --blue: #66b8ff;
      --electric-blue: #4c8dff;
      --periwinkle: #9bbcff;
      --violet: #8d7dff;
      --purple: #b568ff;
      --pink: #ee9dff;
      --lavender: #e6d8ff;
      --text-main: #eaf6ff;
      --text-soft: #bfd8ff;
      --shadow: 0 0 18px rgba(89, 147, 255, 0.18), 0 0 40px rgba(186, 101, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(84, 114, 255, 0.18), transparent 25%),
        radial-gradient(circle at bottom, rgba(196, 88, 255, 0.16), transparent 25%),
        linear-gradient(180deg, #03050d 0%, #060a16 45%, #090f1d 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px 0;
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(
        90deg,
        var(--cyan) 0%,
        var(--bright-cyan) 18%,
        var(--blue) 40%,
        var(--periwinkle) 60%,
        var(--violet) 78%,
        var(--pink) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 28px rgba(119, 194, 255, 0.22);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--text-soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 12px auto;
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(126, 174, 255, 0.35);
      background: rgba(8, 13, 28, 0.9);
      color: var(--ice);
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      outline: none;
      box-shadow: inset 0 0 8px rgba(86, 145, 255, 0.15);
    }

    input::placeholder {
      color: #9db8e5;
      opacity: 0.85;
    }

    input:focus {
      border-color: rgba(138, 202, 255, 0.8);
      box-shadow:
        0 0 0 2px rgba(111, 190, 255, 0.14),
        0 0 18px rgba(111, 190, 255, 0.18);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 12px 18px;
      border: 1px solid rgba(144, 173, 255, 0.28);
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, #58dfff 0%, #4e8cff 42%, #8f65ff 72%, #d57cff 100%);
      box-shadow: 0 0 14px rgba(108, 152, 255, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow:
        0 0 16px rgba(94, 212, 255, 0.25),
        0 0 24px rgba(186, 103, 255, 0.18);
      opacity: 0.96;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      white-space: pre-line;
      background: rgba(5, 9, 20, 0.94);
      color: var(--lavender);
      padding: 16px;
      border-radius: 14px;
      min-height: 88px;
      margin-top: 18px;
      border: 1px solid rgba(131, 150, 255, 0.18);
      box-shadow: inset 0 0 12px rgba(84, 143, 255, 0.08);
      text-align: center;
      line-height: 1.8;
      font-size: 0.88rem;
    }

    .map-title {
      margin: 0 0 16px 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
    }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(136, 167, 255, 0.22);
      box-shadow: inset 0 0 20px rgba(80, 130, 255, 0.08);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 18px;
      }

      button {
        width: 100%;
      }

      .button-group {
        flex-direction: column;
      }

      #map {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>HotspotHub</h1>

      <label for="nickname">Enter your name</label>
      <input id="nickname" type="text" placeholder="Example: Noura" />

      <div class="button-group">
        <button onclick="saveNickname()">Save Name</button>
        <button onclick="startTracking()">Start Live Tracking</button>
        <button onclick="stopTracking()">Stop Tracking</button>
      </div>

      <div id="status">Ready...</div>
    </div>

    <div class="card">
      <h3 class="map-title">Live Map</h3>
      <div id="map"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqRdluD5I2CYDSZFtlLbPhkjjzS8V4zIA",
  authDomain: "location-3698d.firebaseapp.com",
  databaseURL: "https://location-3698d-default-rtdb.firebaseio.com",
  projectId: "location-3698d",
  storageBucket: "location-3698d.firebasestorage.app",
  messagingSenderId: "249053894413",
  appId: "1:249053894413:web:22743ce0f952f170db8244",
  measurementId: "G-M97J8EGLKW"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusEl = document.getElementById("status");
    const nicknameInput = document.getElementById("nickname");

    let watchId = null;
    let map, marker, accuracyCircle;
    let firstLocation = true;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function generateDeviceId() {
      return "phone_" + Math.random().toString(36).slice(2, 10);
    }

    function getDeviceId() {
      let id = localStorage.getItem("device_id");
      if (!id) {
        id = generateDeviceId();
        localStorage.setItem("device_id", id);
      }
      return id;
    }

    function getNickname() {
      return localStorage.getItem("device_name") || "";
    }

    window.saveNickname = function saveNickname() {
      const value = nicknameInput.value.trim();
      localStorage.setItem("device_name", value);
      setStatus(`Saved name: ${value || "none"}\nDevice ID: ${getDeviceId()}`);
    };

    function initMap() {
      map = L.map("map").setView([24.7136, 46.6753], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
    }

    function updateMap(lat, lon, accuracy, deviceName) {
      if (!marker) {
        marker = L.marker([lat, lon]).addTo(map);
        marker.bindPopup(deviceName || "My Location");

        accuracyCircle = L.circle([lat, lon], {
          radius: accuracy || 0,
          color: "#9bbcff",
          fillColor: "#b568ff",
          fillOpacity: 0.18
        }).addTo(map);
      } else {
        marker.setLatLng([lat, lon]);
        marker.setPopupContent(deviceName || "My Location");

        accuracyCircle.setLatLng([lat, lon]);
        accuracyCircle.setRadius(accuracy || 0);
      }

      if (firstLocation) {
        map.setView([lat, lon], 17);
        firstLocation = false;
      } else {
        map.panTo([lat, lon]);
      }
    }

    async function writeLocation(lat, lon, accuracy) {
      const deviceId = getDeviceId();
      const deviceName = getNickname();

      await set(ref(db, "locations/" + deviceId), {
        id: deviceId,
        name: deviceName,
        lat: lat,
        lon: lon,
        accuracy: accuracy,
        timestamp: Date.now()
      });

      setStatus(
        `Tracking active\n` +
        `Device ID: ${deviceId}\n` +
        `Name: ${deviceName || "none"}\n` +
        `Updated: ${new Date().toLocaleTimeString()}`
      );

      updateMap(lat, lon, accuracy, deviceName);
    }

    window.startTracking = function startTracking() {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not supported on this browser.");
        return;
      }

      if (watchId !== null) {
        setStatus("Tracking is already running.");
        return;
      }

      const deviceId = getDeviceId();
      nicknameInput.value = getNickname();

      setStatus(`Starting live tracking...\nDevice ID: ${deviceId}`);

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            await writeLocation(lat, lon, accuracy);
          } catch (err) {
            console.error(err);
            setStatus("Failed to write location to Firebase.");
          }
        },
        (err) => {
          console.error(err);
          setStatus("Location permission denied or unavailable.");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    };

    window.stopTracking = function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        setStatus("Tracking stopped.");
      } else {
        setStatus("Tracking is not running.");
      }
    };

    nicknameInput.value = getNickname();
    initMap();
    setStatus(`Ready.\nDevice ID: ${getDeviceId()}`);
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
