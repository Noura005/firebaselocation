<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      line-height: 1.5;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }

    input {
      padding: 8px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    #status {
      white-space: pre-line;
      background: #111;
      color: #eee;
      padding: 12px;
      border-radius: 8px;
      min-height: 70px;
      margin-top: 12px;
    }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      overflow: hidden;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Live Location Tracker</h2>
    <p class="small">
      Open this same page on different phones. Each phone will be stored separately.
    </p>

    <label for="nickname">Optional phone name</label><br />
    <input id="nickname" type="text" placeholder="Example: Amel iPhone" />
    <br />
    <button onclick="saveNickname()">Save Name</button>
    <button onclick="startTracking()">Start Live Tracking</button>
    <button onclick="stopTracking()">Stop Tracking</button>

    <div id="status">Ready...</div>
  </div>

  <div class="card">
    <h3>Live Map</h3>
    <div id="map"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqRdluD5I2CYDSZFtlLbPhkjjzS8V4zIA",
  authDomain: "location-3698d.firebaseapp.com",
  databaseURL: "https://location-3698d-default-rtdb.firebaseio.com",
  projectId: "location-3698d",
  storageBucket: "location-3698d.firebasestorage.app",
  messagingSenderId: "249053894413",
  appId: "1:249053894413:web:22743ce0f952f170db8244",
  measurementId: "G-M97J8EGLKW"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusEl = document.getElementById("status");
    const nicknameInput = document.getElementById("nickname");

    let watchId = null;
    let map, marker, accuracyCircle;
    let firstLocation = true;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function generateDeviceId() {
      return "phone_" + Math.random().toString(36).slice(2, 10);
    }

    function getDeviceId() {
      let id = localStorage.getItem("device_id");
      if (!id) {
        id = generateDeviceId();
        localStorage.setItem("device_id", id);
      }
      return id;
    }

    function getNickname() {
      return localStorage.getItem("device_name") || "";
    }

    window.saveNickname = function saveNickname() {
      const value = nicknameInput.value.trim();
      localStorage.setItem("device_name", value);
      setStatus(`Saved name: ${value || "none"}\nDevice ID: ${getDeviceId()}`);
    };

    function initMap() {
      map = L.map("map").setView([24.7136, 46.6753], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
    }

    function updateMap(lat, lon, accuracy, deviceName) {
      if (!marker) {
        marker = L.marker([lat, lon]).addTo(map);
        marker.bindPopup(deviceName || "My Location");

        accuracyCircle = L.circle([lat, lon], {
          radius: accuracy || 0
        }).addTo(map);
      } else {
        marker.setLatLng([lat, lon]);
        marker.setPopupContent(deviceName || "My Location");

        accuracyCircle.setLatLng([lat, lon]);
        accuracyCircle.setRadius(accuracy || 0);
      }

      if (firstLocation) {
        map.setView([lat, lon], 17);
        firstLocation = false;
      } else {
        map.panTo([lat, lon]);
      }
    }

    async function writeLocation(lat, lon, accuracy) {
      const deviceId = getDeviceId();
      const deviceName = getNickname();

      await set(ref(db, "locations/" + deviceId), {
        id: deviceId,
        name: deviceName,
        lat: lat,
        lon: lon,
        accuracy: accuracy,
        timestamp: Date.now()
      });

      setStatus(
        `Tracking active\n` +
        `Device ID: ${deviceId}\n` +
        `Name: ${deviceName || "none"}\n` +
        `Updated: ${new Date().toLocaleTimeString()}`
      );

      updateMap(lat, lon, accuracy, deviceName);
    }

    window.startTracking = function startTracking() {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not supported on this browser.");
        return;
      }

      if (watchId !== null) {
        setStatus("Tracking is already running.");
        return;
      }

      const deviceId = getDeviceId();
      nicknameInput.value = getNickname();

      setStatus(`Starting live tracking...\nDevice ID: ${deviceId}`);

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            await writeLocation(lat, lon, accuracy);
          } catch (err) {
            console.error(err);
            setStatus("Failed to write location to Firebase.");
          }
        },
        (err) => {
          console.error(err);
          setStatus("Location permission denied or unavailable.");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    };

    window.stopTracking = function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        setStatus("Tracking stopped.");
      } else {
        setStatus("Tracking is not running.");
      }
    };

    nicknameInput.value = getNickname();
    initMap();
    setStatus(`Ready.\nDevice ID: ${getDeviceId()}`);
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
