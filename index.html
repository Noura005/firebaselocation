<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      line-height: 1.5;
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
    }
    #status {
      white-space: pre-line;
      background: #111;
      color: #eee;
      padding: 12px;
      border-radius: 8px;
      min-height: 120px;
    }
    .small {
      color: #666;
      font-size: 14px;
    }
    input {
      padding: 8px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Live Location Tracker</h2>
    <p class="small">
      Open this same page on different phones. Each phone will be stored separately.
    </p>

    <label for="nickname">Optional phone name</label><br>
    <input id="nickname" type="text" placeholder="Example: Amel iPhone" />
    <br>
    <button onclick="saveNickname()">Save Name</button>
    <button onclick="startTracking()">Start Live Tracking</button>
    <button onclick="stopTracking()">Stop Tracking</button>
  </div>

  <div class="card">
    <strong>Status</strong>
    <div id="status">Waiting...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    // Replace with your real Firebase config
   const firebaseConfig = {
  apiKey: "AIzaSyAqRdluD5I2CYDSZFtlLbPhkjjzS8V4zIA",
  authDomain: "location-3698d.firebaseapp.com",
  databaseURL: "https://location-3698d-default-rtdb.firebaseio.com",
  projectId: "location-3698d",
  storageBucket: "location-3698d.firebasestorage.app",
  messagingSenderId: "249053894413",
  appId: "1:249053894413:web:22743ce0f952f170db8244",
  measurementId: "G-M97J8EGLKW"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusEl = document.getElementById("status");
    const nicknameInput = document.getElementById("nickname");

    let watchId = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function generateDeviceId() {
      return "phone_" + Math.random().toString(36).slice(2, 10);
    }

    function getDeviceId() {
      let id = localStorage.getItem("device_id");
      if (!id) {
        id = generateDeviceId();
        localStorage.setItem("device_id", id);
      }
      return id;
    }

    function getNickname() {
      return localStorage.getItem("device_name") || "";
    }

    window.saveNickname = function saveNickname() {
      const value = nicknameInput.value.trim();
      localStorage.setItem("device_name", value);
      setStatus(`Saved name: ${value || "none"}\nDevice ID: ${getDeviceId()}`);
    };

    async function writeLocation(lat, lon, accuracy) {
      const deviceId = getDeviceId();
      const deviceName = getNickname();

      await set(ref(db, "locations/" + deviceId), {
        id: deviceId,
        name: deviceName,
        lat: lat,
        lon: lon,
        accuracy: accuracy,
        timestamp: Date.now()
      });

      setStatus(
        `Tracking active\n` +
        `Device ID: ${deviceId}\n` +
        `Name: ${deviceName || "none"}\n` +
        `Latitude: ${lat}\n` +
        `Longitude: ${lon}\n` +
        `Accuracy: ${accuracy}m\n` +
        `Updated: ${new Date().toLocaleTimeString()}`
      );
    }

    window.startTracking = function startTracking() {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not supported on this browser.");
        return;
      }

      if (watchId !== null) {
        setStatus("Tracking is already running.");
        return;
      }

      const deviceId = getDeviceId();
      nicknameInput.value = getNickname();

      setStatus(`Starting live tracking...\nDevice ID: ${deviceId}`);

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            await writeLocation(lat, lon, accuracy);
          } catch (err) {
            console.error(err);
            setStatus("Failed to write location to Firebase.");
          }
        },
        (err) => {
          console.error(err);
          setStatus("Location permission denied or unavailable.");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    };

    window.stopTracking = function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        setStatus("Tracking stopped.");
      } else {
        setStatus("Tracking is not running.");
      }
    };

    // Pre-fill name if already saved
    nicknameInput.value = getNickname();
    setStatus(`Ready.\nDevice ID: ${getDeviceId()}`);
  </script>
</body>
</html>
