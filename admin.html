<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotspotHub Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Zen+Dots&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b17;
      --bg-card: rgba(12, 18, 38, 0.88);
      --border-glow: rgba(112, 157, 255, 0.35);
      --cyan: #8fefff;
      --blue: #66b8ff;
      --violet: #8d7dff;
      --pink: #ee9dff;
      --lavender: #e6d8ff;
      --text-main: #eaf6ff;
      --text-soft: #bfd8ff;
      --shadow: 0 0 18px rgba(89, 147, 255, 0.18), 0 0 40px rgba(186, 101, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Zen Dots', sans-serif;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(84, 114, 255, 0.18), transparent 25%),
        radial-gradient(circle at bottom, rgba(196, 88, 255, 0.16), transparent 25%),
        linear-gradient(180deg, #03050d 0%, #060a16 45%, #090f1d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text-main);
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid rgba(126, 174, 255, 0.35);
      background: rgba(8, 13, 28, 0.9);
      color: #d8f9ff;
      font-family: 'Zen Dots', sans-serif;
      text-align: center;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px 18px;
      border: 1px solid rgba(144, 173, 255, 0.28);
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Zen Dots', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, #58dfff 0%, #4e8cff 42%, #8f65ff 72%, #d57cff 100%);
      box-shadow: 0 0 14px rgba(108, 152, 255, 0.22);
    }

    #msg {
      margin-top: 16px;
      min-height: 24px;
      color: var(--pink);
      line-height: 1.6;
    }

    .back-link {
      margin-top: 14px;
      display: inline-block;
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>

    <input id="username" type="text" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="login()">Login</button>

    <div id="msg"></div>

    <a class="back-link" href="index.html">Back to HotspotHub</a>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "ADNNS";

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        sessionStorage.setItem("admin_ok", "true");
        window.location.href = "dashboard.html";
      } else {
        msg.textContent = "Wrong username or password";
      }
    }
  </script>
</body>
</html>
